<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="16" font-weight="bold">ERP AI Agent System — SK Hynix</text>
  <text x="400" y="58" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">SAP ERP × LangGraph × LLM Integration</text>

  <!-- User box -->
  <rect x="30" y="200" width="110" height="60" rx="8" fill="url(#blueGrad)" opacity="0.9"/>
  <text x="85" y="226" text-anchor="middle" fill="white" font-family="monospace" font-size="11" font-weight="bold">User</text>
  <text x="85" y="242" text-anchor="middle" fill="#bfdbfe" font-family="monospace" font-size="9">자연어 입력</text>
  <text x="85" y="254" text-anchor="middle" fill="#bfdbfe" font-family="monospace" font-size="9">업무 요청</text>

  <!-- Arrow: User → LLM -->
  <line x1="140" y1="230" x2="185" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM Service box -->
  <rect x="185" y="185" width="130" height="90" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="250" y="208" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="11" font-weight="bold">사내 LLM</text>
  <text x="250" y="224" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9">Intent Analysis</text>
  <text x="250" y="240" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">─────────</text>
  <text x="250" y="256" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">자연어 → 업무 분류</text>
  <text x="250" y="268" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">컨텍스트 추출</text>

  <!-- Arrow: LLM → LangGraph -->
  <line x1="315" y1="230" x2="360" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LangGraph box -->
  <rect x="360" y="160" width="140" height="140" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="430" y="183" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold">LangGraph</text>
  <text x="430" y="198" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9">Agent Orchestration</text>
  <text x="430" y="214" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">──────────────</text>

  <!-- Tool nodes inside LangGraph -->
  <rect x="372" y="220" width="50" height="24" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="397" y="236" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="8">FI 전표</text>

  <rect x="432" y="220" width="56" height="24" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="460" y="236" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="8">Tool 선택</text>

  <rect x="372" y="254" width="116" height="24" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="430" y="270" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="8">응답 후처리 / 최적화</text>

  <text x="430" y="294" text-anchor="middle" fill="#475569" font-family="monospace" font-size="8">LangFlow 기반 로직 설계</text>

  <!-- Arrow: LangGraph → PyRFC -->
  <line x1="500" y1="230" x2="550" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PyRFC box -->
  <rect x="550" y="195" width="110" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="605" y="218" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="11" font-weight="bold">PyRFC</text>
  <text x="605" y="234" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">Python ↔ SAP</text>
  <text x="605" y="250" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">타입 매핑</text>
  <text x="605" y="262" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">Decimal/Packed 변환</text>

  <!-- Arrow: PyRFC → SAP -->
  <line x1="660" y1="230" x2="700" y2="230" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- SAP ERP box -->
  <rect x="700" y="185" width="80" height="90" rx="8" fill="url(#orangeGrad)" opacity="0.9"/>
  <text x="740" y="208" text-anchor="middle" fill="white" font-family="monospace" font-size="11" font-weight="bold">SAP ERP</text>
  <text x="740" y="224" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="9">RFC/BAPI</text>
  <text x="740" y="240" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="9">FI Module</text>
  <text x="740" y="256" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="9">Custom BAPI</text>
  <text x="740" y="268" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="9">전표 처리</text>

  <!-- Return arrow -->
  <path d="M740 275 Q740 390 430 390 Q200 390 85 275" stroke="#3b82f6" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <text x="400" y="408" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="9">처리 결과 → 자연어 응답 반환</text>

  <!-- Bottom tech stack -->
  <rect x="30" y="440" width="740" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="400" y="456" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">TECH STACK</text>
  <text x="400" y="474" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Python · LangGraph · LangFlow · PyRFC · SAP RFC · SAP BAPI · 사내 LLM</text>

  <!-- Period label -->
  <text x="770" y="480" text-anchor="end" fill="#334155" font-family="monospace" font-size="9">2026.03 ~ 2026.04</text>
</svg>
